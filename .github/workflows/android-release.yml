name: Build & Sign Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Same gate as docker-publish: build the APK only from verified code.
  checks:
    uses: ./.github/workflows/checks.yml

  build-apk:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Release signing is enabled only when the four keystore secrets exist.
      # Without them the Gradle script falls back to the debug keys: the APK
      # still installs (sideload), but its signature differs from a release
      # build, so the app must be UNINSTALLED before updating to a build signed
      # with another key. Add the secrets to enable real release signing:
      #   ANDROID_KEYSTORE_BASE64   (base64 -w0 of the .jks)
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Configure release signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > app/android/key.properties
            echo "Release keystore configured: the APK will be release-signed."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - the APK will be debug-signed."
            echo "::warning::An update over a differently-signed build requires uninstalling the previous APK first."
          fi

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-monitor-apk
          path: app/build/app/outputs/flutter-apk/
          if-no-files-found: error

  # Convenience artifact for manual/static hosting: same bundle the Docker
  # image bakes at /app/web.
  build-web:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Build web bundle
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-monitor-web
          path: app/build/web/
          if-no-files-found: error
