name: Checks

# Reusable gate shared by docker-publish.yml and android-release.yml:
# build/publish jobs only run on verified code (same commit).
on:
  workflow_call:

jobs:
  # WUD auto-deploys `latest` ~2 minutes after the push: never publish an image
  # unless both the Flutter app and the backend are verified on the same commit.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The suite starts its own uvicorn instance with an isolated DB in /tmp.
      - name: Backend e2e tests
        run: python tests/e2e_test.py
