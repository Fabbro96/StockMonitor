<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stock Monitor — monitoraggio mercati e portafoglio self-hosted.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stock Monitor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stock Monitor</title>
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <script>
    /* Il tema persistito (localStorage) vince su `prefers-color-scheme`, così
       il primo frame non "flasha" quando la scelta dell'utente differisce dal
       sistema. `SharedPreferencesAsync` scrive la chiave pura `theme_mode`,
       l'API legacy la stessa con prefisso `flutter.`; il valore è JSON
       (`"dark"`), ma accettiamo anche stringhe raw. */
    (function () {
      try {
        var raw = window.localStorage.getItem('theme_mode') ||
                  window.localStorage.getItem('flutter.theme_mode');
        if (!raw) return;
        var value = raw;
        try { value = JSON.parse(raw); } catch (e) { /* valore raw legacy */ }
        if (value === 'dark' || value === 'light') {
          document.documentElement.setAttribute('data-theme', value);
        }
      } catch (e) { /* localStorage non disponibile: resta prefers-color-scheme */ }
    })();
  </script>
  <style>
    /* Sfondo "Registro" prima del primo frame: niente flash bianco mentre
       Flutter si avvia (carta in chiaro, carbone in scuro). */
    html, body { margin: 0; background: #F4F1EA; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #131211; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #131211; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
