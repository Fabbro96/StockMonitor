# ==============================================================================
# Stock Monitor - File Unico Docker Compose con AUTO-UPDATE (NAS Self-Hosted)
# ==============================================================================
# Inserisci SOLO questo file sul tuo NAS.
#
# Include:
# 1. 'stock-monitor': l'applicazione web completa
# 2. 'wud': What's Up Docker, il servizio di AUTO-UPDATE che controlla GHCR ogni
#    2 minuti e ricrea il container quando cambia il digest dell'immagine.
#    UI/API su http://<IP-NAS>:3001 (3000 è occupata da AdGuard Home).
# ==============================================================================

services:
  stock-monitor:
    image: ghcr.io/fabbro96/stockmonitor:latest
    container_name: stock-monitor
    restart: unless-stopped

    # --- Limiti risorse per NAS ARM64 2 GB RAM ---
    mem_limit: 768m
    cpus: 1.5

    ports:
      - "8000:8000"
    volumes:
      # Cartella locale persistente per il database SQLite (utenti, portafoglio, storico)
      - ./data:/app/data
    environment:
      # --- Google Gemini 3.7 Flash ---
      - GEMINI_API_KEY=your_gemini_api_key_here
      - GEMINI_MODEL=gemini-3.7-flash


      # --- Autenticazione & Sicurezza ---
      - SECRET_KEY=stock-monitor-super-secret-key-2026-nas
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - ACCESS_TOKEN_EXPIRE_DAYS=7

      # --- Notifiche Telegram (Opzionale) ---
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      # Bot interattivo bidirezionale (comandi /value /radar /advice)
      - TELEGRAM_BOT_ENABLED=true

      # --- Analytics & Risk Metrics ---
      - RISK_FREE_RATE=0.02

      # --- Configurazione Generale ---
      - DB_PATH=data/stock_monitor.db
      - ALERT_CHECK_INTERVAL_MINUTES=15
      - LOG_LEVEL=INFO
      - TZ=Europe/Rome
      - PYTHONUNBUFFERED=1

    labels:
      # --- What's Up Docker (WUD): monitoraggio + update automatico ---
      - "wud.watch=true"
      - "wud.tag.include=^latest$$"
      - "wud.display.name=Stock Monitor"
      - "wud.link.template=https://github.com/Fabbro96/StockMonitor/commits/main"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 🔄 AUTO-UPDATE: What's Up Docker (WUD)
  # Controlla ghcr.io/fabbro96/stockmonitor:latest ogni 2 minuti (cron */2) e,
  # quando esce una nuova immagine, ricrea 'stock-monitor' e pota la vecchia.
  # UI/API: http://<IP-NAS>:3001 (host 3001 → container 3000; AdGuard usa 3000).
  # ============================================================================
  wud:
    image: getwud/wud:8.4.0
    container_name: wud
    restart: unless-stopped

    # --- Limiti risorse per NAS ARM64 2 GB RAM ---
    mem_limit: 256m
    cpus: 0.50

    ports:
      - "3001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./wud-store:/store
    environment:
      - TZ=Europe/Rome

      # --- Auth: WUD 8.x usa il provider basic legacy (htpasswd) ---
      # Genera l'hash con:  htpasswd -nb admin 'LaTuaPassword'
      # e raddoppia i '$' nel compose (es. $$apr1$$xxxx$$yyyy).
      # WUD 9 (non ancora stabile) passerà a WUD_AUTH_ADMIN_USER/PASSWORD.
      - WUD_AUTH_BASIC_ADMIN_USER=admin
      - WUD_AUTH_BASIC_ADMIN_HASH=$$apr1$$changeme$$genera_con_htpasswd

      # --- Watcher locale + trigger di update automatico ---
      - "WUD_WATCHER_LOCAL_CRON=*/2 * * * *"
      - WUD_WATCHER_LOCAL_JITTER=15000
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=false
      - WUD_TRIGGER_DOCKER_LOCAL_PRUNE=true

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
