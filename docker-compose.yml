services:
  stock-monitor:
    image: ghcr.io/fabbro96/stock_monitor:latest
    build:
      context: .
    container_name: stock-monitor
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
