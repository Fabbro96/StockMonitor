services:
  stock-monitor:
    image: ghcr.io/fabbro96/stockmonitor:latest
    build:
      context: .
    container_name: stock-monitor
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    env_file:
      - .env
    environment:
      - TZ=Europe/Rome
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    labels:
      - "wud.watch=true"
      - "wud.tag.include=^latest$$"
      - "wud.display.name=Stock Monitor"
      - "wud.display.icon=chart-line"
      - "wud.link.template=https://github.com/Fabbro96/StockMonitor/commits/main"
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
