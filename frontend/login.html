<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Stock Monitor</title>
    <link rel="icon" href="data:,">
    <script src="/static/js/theme-init.js?v=3.0.0"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=3.0.0">
</head>
<body>
    <main class="login-wrapper">
        <div class="login-box">
            <div class="login-logo">📈</div>
            <h1 class="login-title">Stock Monitor</h1>
            <p class="login-subtitle">Accedi alla tua dashboard finanziaria</p>

            <div id="loginAlert" class="alert-error mb-4" style="display:none;" role="alert">
                <span>⚠️</span>
                <span id="loginAlertText">Credenziali non corrette</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Nome Utente</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="Inserisci il tuo nome utente"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password"
                            placeholder="••••••••"
                        >
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostra/Nascondi password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-login" id="submitBtn">
                    <span id="btnText">Accedi</span>
                </button>
            </form>

            <footer class="login-footer">
                <div class="security-badge">
                    🔒 Connessione protetta con crittografia bcrypt e JWT
                </div>
            </footer>
        </div>
    </main>

    <script type="module">
        import { api } from '/static/js/api.js?v=3.0.0';

        // Anti open-redirect: accetta solo path relativi same-origin.
        // I control char TAB/LF/CR vengono rimossi dal parser URL in fase di
        // navigazione: vanno rimossi anche qui, altrimenti `/%09/evil.com`
        // aggira il controllo e diventa `//evil.com`. La validazione finale è
        // semantica: URL risolto rispetto all'origin corrente e stesso origin.
        const getSafeRedirect = () => {
            const redirect = new URLSearchParams(window.location.search).get('redirect');
            const cleaned = (redirect || '').replace(/[\t\n\r]/g, '');
            if (!cleaned) return '/static/index.html';
            try {
                const url = new URL(cleaned, window.location.origin);
                if (url.origin === window.location.origin && url.pathname.startsWith('/')) {
                    const out = url.pathname + url.search + url.hash;
                    // Un pathname che inizia con '//' o '/\' resta protocol-relative
                    // in navigazione (es. https://host//evil.com): va rifiutato.
                    // Defense in depth: il valore ricostruito deve risolvere same-origin.
                    if (!out.startsWith('//') && !out.startsWith('/\\') &&
                        new URL(out, window.location.origin).origin === window.location.origin) {
                        return out;
                    }
                }
            } catch (e) {
                // URL malformato: fallback sicuro.
            }
            return '/static/index.html';
        };

        // Check if already authenticated
        (async () => {
            try {
                const me = await api.getMe();
                if (me && me.username) {
                    window.location.href = getSafeRedirect();
                }
            } catch (e) {
                // Not authenticated, stay on login page
            }
        })();

        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        });

        // Form submit
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('loginAlert');
        const alertText = document.getElementById('loginAlertText');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) return;

            submitBtn.disabled = true;
            btnText.textContent = 'Verifica in corso...';

            try {
                const res = await api.login(username, password);
                if (res && res.access_token) {
                    localStorage.setItem('auth_token', res.access_token);
                    localStorage.setItem('auth_username', res.username);

                    window.location.href = getSafeRedirect();
                }
            } catch (err) {
                alertBox.style.display = 'flex';
                alertText.textContent = err.message || 'Errore durante il login. Riprova.';
                passInput.value = '';
                passInput.focus();
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Accedi';
            }
        });
    </script>
</body>
</html>
